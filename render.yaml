services:
  - type: web
    name: sducoss-backend
    env: docker
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
    ports:
      - 10000